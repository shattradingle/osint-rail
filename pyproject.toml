[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-rail"
dynamic = ["version"]
description = "Keyless OSINT: one seed in, a sourced dossier out, every claim with its URL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExotericTar", email = "206703453+ExotericTar@users.noreply.github.com" }]
keywords = ["osint", "reconnaissance", "research", "cli", "mcp", "ai-agents", "no-api-key"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osint-rail = "osint_rail.cli:main"

[project.urls]
Homepage = "https://github.com/shattradingle/osint-rail"
Source = "https://github.com/shattradingle/osint-rail"
Changelog = "https://github.com/shattradingle/osint-rail/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "osint_rail.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
